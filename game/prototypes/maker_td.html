<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a22"><title>PRO 統合メーカー T&amp;D（プロトタイプ）</title>
<style>
:root{color-scheme:dark;--bg:#10171d;--panel:#18232c;--line:#32424d;--muted:#a7b8c4;--ink:#ecf1ee;--accent:#d6ed83;--blue:#80b9d4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;font-size:15px}button,input,select{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}input,select{background:#0e161c;border:1px solid var(--line);padding:10px;min-height:44px;width:100%}
.testbar{background:#d6ed83;color:#18251b;padding:9px 16px;font-size:12px;font-weight:700;letter-spacing:.06em}.shell{max-width:1200px;margin:auto;padding:0 16px}header{min-height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:20px;font-weight:850;letter-spacing:.08em}.brand span{font-size:11px;display:block;color:var(--muted);letter-spacing:.2em;margin-top:4px}main{padding:24px 0 40px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);margin:0 0 8px}h1{font-size:26px;font-weight:650;letter-spacing:.05em;margin:0 0 8px}.sub{color:var(--muted);font-size:13px;margin:0}.primary{border:0;background:var(--accent);color:#172119;padding:12px 20px;font-weight:750;min-height:46px}.secondary{background:transparent;border:1px solid var(--line);padding:10px 16px;min-height:44px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);max-width:480px;width:calc(100% - 32px);padding:24px}dialog::backdrop{background:#060c12c9}dialog p{font-size:14px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:16px 0;color:var(--muted);font-size:11px}
</style>
<link rel="stylesheet" href="tactical_map.css"><link rel="stylesheet" href="maker_td.css"></head>
<body>
<div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle"><form id="gateForm" class="gate-card" autocomplete="off"><p class="eyebrow">CREATOR ACCESS</p><h1 id="gateTitle">製作者用テスト</h1><p class="sub">パスワードを入力してください。</p><input id="gatePassword" type="password" inputmode="numeric" aria-label="パスワード" autocomplete="off"><p id="gateError" class="gate-error" role="alert"></p><button class="primary" type="submit">入る</button></form></div>
<div class="testbar">製作者テスト用 / MAKER PROTOTYPE</div>
<div class="shell" id="shell" inert>
<header><div class="brand">PRO 統合メーカー T&amp;D<span>TACTICAL &amp; DISPATCH DATA MAKER — PROTOTYPE</span></div><span id="saveState" class="sub" aria-live="polite"></span></header>
<main>
 <section id="menuView" aria-labelledby="menuTitle"><p class="eyebrow">DATA WORKSHOP</p><h1 id="menuTitle" tabindex="-1">何を作る？</h1><p class="sub" id="menuStats"></p>
  <div class="td-menu cmd-window-inline"><div class="cmd-list" role="menu" aria-label="メニュー">
   <button data-open="units" role="menuitem"><span>ユニット</span><small data-count="units"></small></button>
   <button data-open="weapons" role="menuitem"><span>武装</span><small data-count="weapons"></small></button>
   <button data-open="skills" role="menuitem"><span>スキル</span><small data-count="skills"></small></button>
   <button id="menuImport" role="menuitem"><span>読み込み</span><small>ファイル（T&amp;D／統合JS・JSON）</small></button>
   <button id="menuBase" role="menuitem"><span>PRO・Dの基本データを読み込む</span><small>サンプルとして</small></button>
   <button id="menuExport" role="menuitem"><span>書き出し</span><small>T&amp;D形式（JSON）</small></button>
   <button id="menuReset" role="menuitem"><span>すべて消して新しく始める</span></button>
  </div></div><input id="importFile" type="file" accept=".js,.json,application/json,text/javascript" hidden>
 </section>
 <section id="listView" hidden aria-labelledby="listTitle"><div class="td-head"><div><p class="eyebrow" id="listEyebrow"></p><h1 id="listTitle" tabindex="-1"></h1></div><button class="secondary" type="button" id="backMenu">← メニュー</button></div>
  <div class="td-layout"><aside class="td-side"><div class="td-tools"><input id="listSearch" type="search" placeholder="名前・IDで検索" aria-label="検索"><button class="primary" type="button" id="listNew">＋ 新しく作る</button></div><div id="itemList" class="cmd-list td-items" role="menu" aria-label="一覧"></div></aside>
  <section class="td-editor" aria-label="編集"><div id="editorEmpty" class="sub">左の一覧から選ぶか、「新しく作る」を押してください。</div><div id="editor" hidden><div class="td-editor-head"><div><h2 id="editName"></h2><p id="editId" class="sub"></p></div><div class="td-editor-actions"><button class="secondary" type="button" id="editCopy">複製</button><button class="secondary" type="button" id="editDelete">削除</button></div></div><p id="editIssues" class="td-issues" role="status"></p><div id="editRows" class="cmd-list td-rows" role="menu" aria-label="項目"></div><div id="editUsage" class="td-usage"></div></div></section></div>
 </section>
</main>
<footer>PHANTASIA RECORD OPS · T&amp;D MAKER PROTOTYPE — データはこのブラウザに自動保存されます。公開中のゲームのデータ・セーブには影響しません。</footer>
</div>
<dialog id="inputWin" class="cmd-window detail-window" aria-labelledby="inputTitle"><p class="eyebrow" id="inputKind"></p><h2 id="inputTitle"></h2><p id="inputHelp" class="cmd-status"></p><div id="inputBody" class="cmd-scroll"></div><p id="inputError" class="gate-error" role="alert"></p><div class="cmd-list" id="inputActions"></div></dialog>
<dialog id="msgWin" class="cmd-window detail-window" aria-labelledby="msgTitle"><h2 id="msgTitle"></h2><div id="msgBody" class="cmd-scroll"></div><div class="cmd-list" id="msgActions"></div></dialog>
<dialog id="screenFade" class="screen-fade" aria-label="画面切り替え"><p id="screenFadeLabel"></p></dialog>
<script src="../shared/pro_core.js"></script><script src="transition.js"></script><script src="maker_td.js"></script>
</body></html>
