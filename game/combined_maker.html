<script>
(()=>{'use strict';

const T=window.PROTemplates;

function hireNames(){const n={};for(const k of ['missions','research','items'])for(const x of pack[k]||[])n[x.id]=x.name||x.id;return n;}
function openPicker(){

  if(kind==='hires'){const players=pack.units.filter(u=>u.deploy?.player!==false);const sec=el('section');sec.className='flow-section';sec.append(el('h3','雇えるユニットを選ぶ'));if(!players.length){sec.append(el('p','味方として出撃できるユニットがありません。先に「ユニット」タブで作ってください。'));box.append(sec);return;}const sel=el('select');sel.setAttribute('aria-label','雇えるユニット');for(const u of players){const o=el('option',`${u.name}（${E.starRating(u).text}）`);o.value=u.id;sel.append(o);}const cost=el('input');cost.type='number';cost.min=0;cost.value=1000;cost.setAttribute('aria-label','雇用費');const lc=el('label','雇用費');lc.append(cost);sec.append(sel,lc,btn('この内容で作る',()=>{const h=E.newHire(sel.value);h.id=uniqueId('hire_'+sel.value);h.cost=Math.max(0,Number(cost.value)||0);pack.hires.push(h);selected=pack.hires.length-1;step=0;close();save();show('editor');notify('雇用候補を作成しました。雇えるようになる条件を設定できます。');}),btn('やめる',close));box.append(sec);return;}
  const finish=obj=>{pack[kind].push(obj);selected=pack[kind].length-1;step=0;close();save();show('editor');notify(`「${obj.name}」を作成しました。必要なら内容を調整して、最後に「パック・出力」から書き出してください。`);};
  if(kind==='units')E.templatePicker(box,{title:'ユニットをテンプレートから作る',lead:'役割を選んで、強さと使い方を決めるだけで完成します。',templates:T.units,selects:[{key:'tier',label:'強さ',value:'normal',options:T.tiers.map(t=>[t.key,`${t.label}（${t.desc}）`])},{key:'faction',label:'使い方',value:'both',options:Object.entries(T.factions).map(([k,f])=>[k,f.label])}],onPick:(key,v,name)=>finish(T.makeUnit(key,v.tier,v.faction,name,idsOf('units'))),onCancel:close});

function collectIssues(){

function normalizedUnit(u){if(!C.safeId(u.id)||!String(u.name||'').trim())throw new Error('ユニットID・名前が必要です');const o={id:u.id,name:String(u.name),role:String(u.role||''),pilot:String(u.pilot||''),mark:String(u.mark||''),tags:C.unitTags(u),ability:String(u.ability||''),deploy:{player:u.deploy?.player!==false,enemy:!!u.deploy?.enemy},skills:(Array.isArray(u.skills)?u.skills:legacySkills(u.ability)).map(C.skill),weapons:(u.weapons||[]).map(normalizeWeapon)};if(!o.weapons.length)throw new Error(u.id+': 武装が必要です');for(const sk of o.skills)if(o.skills.filter(x=>x.id===sk.id).length>1)throw new Error(u.id+': スキルIDが重複しています');for(const k of ['hp','atk','def','mob','acc']){const n=Number(u[k]);if(!Number.isSafeInteger(n)||n<(k==='hp'?1:0))throw new Error(u.id+': '+k+' は整数で指定してください');o[k]=n;}Object.assign(o,C.unitExt(u));return o;}
function normalizedMission(m){if(!C.safeId(m.id)||!String(m.name||'').trim())throw new Error('作戦ID・名前が必要です');if(!Array.isArray(m.enemies)||!m.enemies.length||m.enemies.length>8||m.enemies.some(id=>!C.safeId(id)))throw new Error(m.id+': 敵編成を1～8体指定してください');const reward=Number(m.reward),maxDeploy=Number(m.maxDeploy);if(!Number.isSafeInteger(reward)||reward<0||!Number.isInteger(maxDeploy)||maxDeploy<1||maxDeploy>8)throw new Error(m.id+': 報酬・出撃上限が不正です');const drops=(m.drops||[]).map(d=>{try{if(!d.odds&&!Number.isFinite(Number(d.chance)))throw 0;return C.drop({...d,min:Number(d.min),max:Number(d.max),...(d.odds?{}:{chance:Number(d.chance)})},m.id);}catch(e){throw new Error(m.id+': ドロップ設定が不正です'+(e&&e.message?'（'+e.message+'）':''));}});return {id:m.id,name:String(m.name),diff:String(m.diff||'E'),reward,desc:String(m.desc||''),terrain:String(m.terrain||'標準'),tags:Array.isArray(m.tags)?m.tags.map(String):[],rules:Array.isArray(m.rules)?m.rules.map(r=>C.rule(r,m.id)):[],enemies:[...m.enemies],maxDeploy,drops,...C.missionExt(m)};}
function validated(){if(!pack.units.length&&!pack.missions.length&&!pack.items.length)throw new Error('ユニット・作戦・アイテムを追加してください');const out=C.bundlePack({...pack,units:pack.units.map(normalizedUnit),missions:pack.missions.map(normalizedMission),pilots:pack.pilots||[],research:pack.research||[],hires:pack.hires||[]});const enemies=new Set(out.units.filter(u=>u.deploy.enemy).map(u=>u.id)),allUnits=new Set(out.units.map(u=>u.id)),items=new Set(out.items.map(i=>i.id));for(const m of out.missions){if(m.objective?.escortUnitId&&!allUnits.has(m.objective.escortUnitId))throw new Error(m.name+': 護衛対象「'+m.objective.escortUnitId+'」が統合パック内にありません');for(const id of C.missionEnemyIds(m))if(!enemies.has(id))throw new Error(m.name+': 敵ユニット「'+id+'」が統合パック内で敵出撃可能になっていません');for(const d of m.drops)if(!items.has(d.itemId))throw new Error(m.name+': ドロップアイテム「'+d.itemId+'」が統合パック内にありません');}const players=new Set(out.units.filter(u=>u.deploy.player).map(u=>u.id));for(const h of out.hires||[])if(!players.has(h.unitId))throw new Error('雇用候補「'+h.id+'」: 味方ユニット「'+h.unitId+'」が統合パック内にありません');return out;}
function preview(){const il=collectIssues();E.issues($('issueBox'),il,{okText:'✓ 問題はありません。書き出せます。'});try{const out=validated();$('code').value=C.serialize('VAIS_BUNDLE_PACK',out);$('validation').className='notice';$('validation').textContent=`出力可能：ユニット ${out.units.length} / 作戦 ${out.missions.length} / アイテム ${out.items.length}${out.hires?.length?` / 雇用候補 ${out.hires.length}`:''}（Bundle Schema ${out.schemaVersion}）`;$('download').disabled=false;$('copy').disabled=false;}catch(e){$('code').value='';$('validation').className='notice bad';$('validation').textContent=e.message;$('download').disabled=true;$('copy').disabled=true;}}
function mergeTerrains(list){const byName=new Map((pack.terrains||[]).map(t=>[t.name,t]));for(const t of list||[])byName.set(t.name,C.clone(t));pack.terrains=[...byName.values()];}
function mergeRows(key,rows,replace){if(replace){pack[key]=C.clone(rows);return;}const byId=new Map((pack[key]||[]).map(x=>[x.id,x]));for(const row of rows)byId.set(row.id,C.clone(row));pack[key]=[...byId.values()];}
function applyIncoming(incoming,replace){if(incoming.format===C.BUNDLE_FORMAT){const b=C.bundlePack(incoming);if(replace){pack={pilots:[],research:[],hires:[],...b};}else{for(const key of ['units','missions','items','pilots','research','hires'])mergeRows(key,b[key]||[],false);mergeTerrains(b.terrains);}terrainsChanged();return;}
 const kinds={'VAIS_OUTER_OPS_UNIT_PACK':'units','VAIS_OUTER_OPS_MISSION_PACK':'missions','VAIS_OUTER_OPS_ITEM_PACK':'items'},key=kinds[incoming.format];if(!key||!Array.isArray(incoming[key]))throw new Error('対応するPROパックではありません');if(key==='items'){incoming=C.itemPack(incoming);if(incoming.research)mergeRows('research',incoming.research,replace);}else if(key==='units'&&![1,2,3,4,5,6].includes(Number(incoming.schemaVersion)))throw new Error('Unit Schema 1～6が必要です');else if(key==='missions'&&![1,2,3,4].includes(Number(incoming.schemaVersion)))throw new Error('Mission Schema 1～4が必要です');if(key==='units'&&Array.isArray(incoming.hires)&&incoming.hires.length)mergeRows('hires',C.hireList(incoming.hires),replace);if(key==='missions'&&incoming.terrains)mergeTerrains(C.terrainList(incoming.terrains));if(key==='units'&&Array.isArray(incoming.pilots)){const conv=C.pilotsToUnits(incoming.units,incoming.pilots);incoming={...incoming,units:conv.units};if(conv.converted.length)notify(`旧形式のパイロット ${conv.converted.length}人をユニットに変換しました`);}if(key==='units')incoming.units=incoming.units.map(u=>({...u,skills:Array.isArray(u.skills)?u.skills:legacySkills(u.ability)}));mergeRows(key,incoming[key],replace);}
function importTexts(texts){const parsed=texts.map(text=>{const marker=['VAIS_BUNDLE_PACK','VAIS_UNIT_PACK','VAIS_MISSION_PACK','VAIS_ITEM_PACK'].find(k=>text.includes(k));if(!marker)throw new Error('パック変数が見つかりません');return C.parse(text,marker)});const previous=C.clone(pack),replace=$('importMode').value==='replace';try{for(const incoming of parsed)applyIncoming(incoming,replace);C.bundlePack(pack);}catch(e){pack=previous;throw e;}selected=-1;save();drawTerrains();preview();show('overview');}
$('packId').oninput=()=>{pack.packId=$('packId').value;save();preview()};$('packName').oninput=()=>{pack.packName=$('packName').value;save();preview()};$('add').onclick=()=>{pack[kind].push(starter());selected=pack[kind].length-1;step=0;save();show('editor')};$('search').oninput=renderList;
$('duplicate').onclick=()=>{const c=C.clone(current());c.id=uniqueId(c.id+'_copy');if(typeof c.name==='string')c.name+=' コピー';pack[kind].push(c);selected=pack[kind].length-1;save();renderForm()};$('delete').onclick=()=>{if(!confirm(current().name+' を削除しますか？'))return;pack[kind].splice(selected,1);selected=-1;save();show('collection')};
$('toList').onclick=()=>show('collection');$('prev').onclick=()=>{step=Math.max(0,step-1);renderForm();window.scrollTo(0,0)};$('next').onclick=()=>{step=Math.min((steps[kind]||[0]).length-1,step+1);renderForm();window.scrollTo(0,0)};
$('loadSamples').onclick=()=>{if(!confirm('同梱のテスト統合パックを読み込みますか？'))return;try{const inputs=[window.VAIS_UNIT_PACK,window.VAIS_MISSION_PACK,window.VAIS_ITEM_PACK];if(inputs.some(x=>!x))throw new Error('同梱JSが見つかりません');importTexts(inputs.map(x=>C.serialize(x.units?'VAIS_UNIT_PACK':x.missions?'VAIS_MISSION_PACK':'VAIS_ITEM_PACK',x)));notify('同梱データを読み込みました');}catch(e){notify(e.message,true)}};
$('importFiles').onchange=async e=>{const files=[...(e.target.files||[])];try{const texts=await Promise.all(files.map(x=>x.text()));if(!texts.length)return;const mode=$('importMode').value;if(!confirm(`${files.length}ファイルを${mode==='replace'?'置換':'統合'}しますか？`))return;importTexts(texts);notify('データを読み込みました');}catch(err){notify('読み込み失敗: '+err.message,true)}finally{e.target.value='';}};
$('resetPack').onclick=()=>{if(!confirm('編集中のユニット・作戦・アイテムを削除しますか？'))return;pack=fresh();terrainsChanged();drawTerrains();selected=-1;$('packId').value=pack.packId;$('packName').value=pack.packName;save();preview()};
$('download').onclick=()=>{try{const out=validated();M.download(out.packId,C.serialize('VAIS_BUNDLE_PACK',out));notify('統合JSを書き出しました');E.afterExport($('message'),'bundle');}catch(e){notify(e.message,true)}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(C.serialize('VAIS_BUNDLE_PACK',validated()));notify('コピーしました')}catch(e){$('code').focus();$('code').select();notify('自動コピーできません。出力欄を長押ししてください。')}};
$('addTemplate').onclick=openPicker;
$('fixIds').onclick=()=>{const r=E.fixIds(pack);save();preview();notify(r.length?`IDを${r.length}件付け直しました（参照も更新済み）: `+r.slice(0,6).map(x=>`${x.name||x.kind} → ${x.to}`).join(' / '):'直す必要のあるIDはありませんでした。');};
E.modeToggle($('modeBox'),()=>{if(scene==='editor')renderForm();else if(scene==='collection')renderList();});
E.guide($('guideBox'),'combined','はじめての方へ（3ステップ）',['上のタブで「ユニット」を開き、「テンプレートから作る」で味方と敵を作ります。','「ミッション」で作戦を、「アイテム」でドロップ品を同じようにテンプレートから作ります。','この画面に戻って「統合JSを書き出す」→ ゲームの「データ管理 → 統合JSを読み込む」で遊べます。']);
M.register('bundle',{exportPack:validated,readPack:text=>C.bundlePack(C.parse(text,'VAIS_BUNDLE_PACK')),importPack:text=>importTexts([text]),draftKey:KEY});
try{const draft=M.getDraft(KEY);if(draft)pack={pilots:[],research:[],terrains:[],hires:[],...C.bundlePack(draft)};}catch(e){notify('下書きを読み込めませんでした: '+e.message,true)}try{C.registerTerrains(C.terrainList(pack.terrains||[]));}catch(e){}drawTerrains();draftReady=true;$('packId').value=pack.packId;$('packName').value=pack.packName;$('links').append(M.links());counts();preview();show('overview');
})();
